<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Sertifikat - Media Tulisan Manusia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 20px;
        }
        .header {
            background-color: #10375C; /* Warna biru gelap sesuai tema sidebar sertifikat */
            color: #ffffff;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 5px solid #2ecc71; /* Garis hijau penanda valid */
            border-bottom-left-radius: 15px; /* Mengikuti gaya soft-curved */
            border-bottom-right-radius: 15px;
        }
        .logo {
            width: 90px;
            height: auto;
            margin-bottom: 15px;
            object-fit: contain;
        }
        .status-icon {
            font-size: 45px;
            color: #2ecc71;
            margin-bottom: 5px;
            line-height: 1;
        }
        .status-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .content {
            padding: 25px 25px 10px 25px;
        }
        .data-group {
            margin-bottom: 18px;
            border-bottom: 1px dashed #e0e0e0;
            padding-bottom: 12px;
        }
        .data-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .label {
            font-size: 0.8rem;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .value {
            font-size: 1.05rem;
            color: #2c3e50;
            font-weight: 700;
        }
        .footer {
            padding: 20px 25px 30px 25px;
            text-align: center;
            background-color: #ffffff;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #10375C;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(16, 55, 92, 0.2);
            gap: 10px;
        }
        .btn:hover {
            background-color: #1a4f85;
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Logo dipanggil dari logopt.webp -->
        <img src="logopt.webp" alt="Logo Media Tulisan Manusia" class="logo" onerror="this.style.display='none'">
        <div class="status-icon">✓</div>
        <div class="status-text">SERTIFIKAT VALID</div>
        <div style="font-size: 0.85rem; font-weight: normal; margin-top: 5px; opacity: 0.9;">Telah diverifikasi oleh sistem</div>
    </div>

    <div class="content">
        <div class="data-group">
            <div class="label">Nomor Sertifikat</div>
            <div class="value">001/SP-LN/MTM/XI/2026</div>
        </div>
        <div class="data-group">
            <div class="label">Diberikan Kepada</div>
            <div class="value">Nikita Jasmine Almira</div>
        </div>
        <div class="data-group">
            <div class="label">Peran / Predikat</div>
            <div class="value">Juri Utama</div>
        </div>
        <div class="data-group">
            <div class="label">Nama Kegiatan</div>
            <div class="value">Lomba Novela 2026</div>
        </div>
        <div class="data-group">
            <div class="label">Penyelenggara</div>
            <div class="value">Media Tulisan Manusia</div>
        </div>
        <div class="data-group">
            <div class="label">Tanggal Terbit</div>
            <div class="value">20 November 2026</div>
        </div>
    </div>

    <div class="footer">
        <!-- Link mengarah langsung ke 001.pdf -->
        <a href="001.pdf" class="btn" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><!--!Font Awesome Free 6.5.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path d="M0 64C0 28.7 28.7 0 64 0H229.5c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64zm384 64H256V0L384 128z"/></svg>
            Lihat File PDF Asli
        </a>
    </div>
</div>

</body>
</html>
